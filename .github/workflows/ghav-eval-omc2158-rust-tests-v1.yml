name: GHAV oh-my-codex 2158 complete Rust tests
on:
  push:
    branches: ['codex/ghav-omc2158-rust-tests-v1-*']
permissions:
  contents: read
jobs:
  rust-tests:
    name: Complete Rust Tests + Coverage Signal job
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fixed historical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ac191754a8293c83e7d6ff67b721fd2aab5dee8d
          persist-credentials: false
      - name: Setup Rust with LLVM tools
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - name: Restore Rust build cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: ghav-omc2158-rust-tests-v1
          shared-key: full-rust-tests
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Record fixed task context
        run: |
          echo "GHAV_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "GHAV_CARGO_LOCK_SHA=$(sha256sum Cargo.lock | cut -d ' ' -f1)"
          echo "GHAV_RUSTC_VERSION=$(rustc --version | tr ' ' '_')"
          echo "GHAV_CARGO_VERSION=$(cargo --version | tr ' ' '_')"
          echo "GHAV_LLVM_COV_VERSION=$(cargo llvm-cov --version | tr ' ' '_')"
          echo "GHAV_RUST_CACHE_HIT=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "GHAV_TRACKED_STATUS_LINES_BEFORE=$(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
      - name: Run complete Rust tests with two coverage summaries
        shell: bash
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --workspace --summary-only | tee coverage/rust/workspace-summary.txt
          cargo llvm-cov --manifest-path crates/omx-sparkshell/Cargo.toml --summary-only | tee coverage/rust/omx-sparkshell-summary.txt
      - name: Add Rust coverage summary to job summary
        shell: bash
        run: |
          {
            echo '## Rust Test Coverage Summary'
            echo ''
            echo '### Workspace'
            echo '```text'
            cat coverage/rust/workspace-summary.txt
            echo '```'
            echo ''
            echo '### omx-sparkshell manifest'
            echo '```text'
            cat coverage/rust/omx-sparkshell-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record complete coverage output witness
        run: |
          echo "GHAV_WORKSPACE_SUMMARY_SHA=$(sha256sum coverage/rust/workspace-summary.txt | cut -d ' ' -f1)"
          echo "GHAV_SPARKSHELL_SUMMARY_SHA=$(sha256sum coverage/rust/omx-sparkshell-summary.txt | cut -d ' ' -f1)"
          echo "GHAV_JOB_SUMMARY_SHA=$(sha256sum "$GITHUB_STEP_SUMMARY" | cut -d ' ' -f1)"
          echo "GHAV_COVERAGE_FILE_COUNT=$(find coverage/rust -type f | wc -l | tr -d ' ')"
          echo "GHAV_CARGO_LOCK_SHA_AFTER=$(sha256sum Cargo.lock | cut -d ' ' -f1)"
          echo "GHAV_TRACKED_STATUS_LINES_AFTER=$(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
